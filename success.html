<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>결제 완료 — 태명당</title>
<style>
  body{margin:0; background:#0D0E10; color:#EDEAE2; font-family:'Noto Sans KR',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;}
  .box{max-width:420px;}
  h1{font-family:'Noto Serif KR',serif; font-size:32px; color:#D4AF6A; margin-bottom:16px;}
  p{font-size:14px; color:#8A8A85; line-height:1.7;}
  a{display:inline-block; margin-top:24px; padding:14px 28px; background:#B08D57; color:#0D0E10; text-decoration:none; font-weight:bold; border-radius:4px;}
</style>
</head>
<body>
<div class="box">
  <h1>결제가 완료됐어요 🎉</h1>
  <p id="msg">주문번호를 확인하고 있어요...</p>
  <a href="/">메인으로 돌아가기</a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('orderId');
  const amount = params.get('amount');
  const paymentKey = params.get('paymentKey');
  document.getElementById('msg').innerText =
    `주문번호 ${orderId} · ${Number(amount).toLocaleString()}원 결제가 접수되었습니다.\n메인 화면으로 돌아가 전체 태명을 확인해보세요.`;
  // NOTE: 실제 서비스에서는 여기서 서버로 paymentKey, orderId, amount를 보내
  // 시크릿 키로 결제 승인(confirm) API를 호출해야 최종 승인 처리가 완료됩니다.
</script>
</body>
</html>
