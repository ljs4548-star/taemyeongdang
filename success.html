<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>결제 확인 — 태명당</title>
<style>
  body{margin:0; background:#0D0E10; color:#EDEAE2; font-family:'Noto Sans KR',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;}
  .box{max-width:420px;}
  h1{font-size:26px; color:#D4AF6A; margin-bottom:16px;}
  p{font-size:14px; color:#8A8A85; line-height:1.7;}
  a{display:inline-block; margin-top:24px; padding:14px 28px; background:#B08D57; color:#0D0E10; text-decoration:none; font-weight:bold; border-radius:4px;}
</style>
</head>
<body>
<div class="box">
  <h1 id="title">결제를 확인하고 있어요</h1>
  <p id="msg">잠시만 기다려 주세요. 이 화면을 닫지 마세요.</p>
  <a href="/" id="back" style="display:none;">메인으로 돌아가기</a>
</div>
<script>
(async function(){
  const p = new URLSearchParams(location.search);
  const paymentKey = p.get('paymentKey'), orderId = p.get('orderId'), amount = p.get('amount');
  const dad = p.get('d')||'', mom = p.get('m')||'', due = p.get('u')||'', gender = p.get('g')||'모름';
  const title = document.getElementById('title'), msg = document.getElementById('msg');
  function fail(t){
    title.textContent = '결제 확인에 문제가 있어요';
    msg.textContent = t + ' 결제가 되었는데 열리지 않으면 ljs4548@gmail.com 으로 주문번호(' + (orderId||'') + ')를 보내주세요.';
    document.getElementById('back').style.display = 'inline-block';
  }
  if(!paymentKey || !orderId){ fail('결제 정보를 찾을 수 없습니다.'); return; }
  const store = (()=>{ try{ return JSON.parse(localStorage.getItem('tmd_tokens')||'{}'); }catch(e){ return {}; } })();
  const key = [dad,mom,due,gender].join('|');
  function done(){
    try{ sessionStorage.setItem('tmd_restore', JSON.stringify({dad,mom,due,gender})); }catch(e){}
    title.textContent = '결제가 완료됐어요';
    msg.textContent = '전체 태명을 불러옵니다...';
    setTimeout(()=>{ location.replace('/'); }, 900);
  }
  if(store[key] && store[key].orderId === orderId){ done(); return; }
  try{
    const r = await fetch('/api/t?action=confirm', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({paymentKey, orderId, amount:Number(amount), dad, mom, due, gender})
    });
    const d = await r.json();
    if(!r.ok || !d.ok){ fail(d.error || '결제 승인에 실패했습니다.'); return; }
    store[key] = {token:d.token, orderId};
    try{ localStorage.setItem('tmd_tokens', JSON.stringify(store)); }catch(e){}
    done();
  }catch(e){ fail('네트워크 오류가 발생했습니다.'); }
})();
</script>
</body>
</html>
